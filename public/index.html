async function handleListingUpload(event) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  if (files.length > 10) { alert('Maximum 10 files allowed.'); return; }
  for (const f of files) {
    if (f.size > 10 * 1024 * 1024) { alert(`${f.name} is too large. Maximum 10MB per file.`); return; }
  }
  const uploadArea = document.getElementById('listing-upload-area');
  const uploadText = document.getElementById('listing-upload-text');
  const resultArea = document.getElementById('listing-analysis-result');
  uploadArea.classList.add('loading');
  uploadText.textContent = `Analyzing ${files.length} file${files.length > 1 ? 's' : ''}\u2026`;
  resultArea.innerHTML = '';
  try {
    const fileData = await Promise.all(files.map(async f => {
      const data = await fileToBase64(f);
      const mediaType = f.type || (f.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');
      return { data, mediaType };
    }));
    const res = await fetch(`${API_BASE}/api/analyze-listing`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Access-Pin': accessPin },
      body: JSON.stringify({ files: fileData })
    });
    if (res.status === 401) { resultArea.innerHTML = vinError('Incorrect PIN. Reload the page to re-enter your PIN.'); return; }
    if (res.status === 429) { resultArea.innerHTML = vinError('Daily limit reached (20 analyses/day). Try again tomorrow.'); return; }
    if (!res.ok) { const err = await res.json().catch(()=>({})); resultArea.innerHTML = vinError(err.error || `Server error (${res.status})`); return; }
    const analysis = await res.json();
    listingAnalysisResult = analysis;
    checkBothDone();
    resultArea.innerHTML = renderListingResults(analysis);
  } catch (err) {
    resultArea.innerHTML = vinError(`Failed: ${err.message}`);
  } finally {
    uploadArea.classList.remove('loading');
    uploadText.textContent = 'Click to upload different files';
  }
}

function renderListingResults(a) {
  let html = '<div style="margin-top:16px">';
  if (a.year || a.make || a.model) {
    html += `<div style="font-size:1.05rem;font-weight:600;margin-bottom:10px">${[a.year, a.make, a.model].filter(Boolean).join(' ')}</div>`;
  }
  html += '<div class="stat-pills">';
  if (a.asking_price) html += `<div class="stat-pill">$${Number(a.asking_price).toLocaleString()}</div>`;
  if (a.mileage) html += `<div class="stat-pill">${Number(a.mileage).toLocaleString()} mi</div>`;
  if (a.seller_type && a.seller_type !== 'Unknown') html += `<div class="stat-pill">${a.seller_type}</div>`;
  if (a.location) html += `<div class="stat-pill">${a.location}</div>`;
  if (a.owner_count != null) html += `<div class="stat-pill">${a.owner_count} Owner${a.owner_count !== 1 ? 's' : ''}</div>`;
  html += '</div>';
  if (a.summary) {
    html += `<div style="background:var(--surface2);border-radius:8px;padding:14px;margin:12px 0;font-size:0.88rem;line-height:1.6">${a.summary}</div>`;
  }
  if (a.red_flags?.length) {
    html += `<div style="font-family:'Space Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:2px;color:var(--red);margin-bottom:8px">Red Flags</div>`;
    a.red_flags.forEach(f => { html += `<div class="flag-item red">\u26a0 ${f}</div>`; });
  }
  if (a.seller_claims?.length) {
    html += `<div style="font-family:'Space Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);margin:12px 0 8px">Seller's Claims</div>`;
    a.seller_claims.forEach(c => { html += `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:0.85rem">${c}</div>`; });
  }
  if (a.questions_to_ask?.length) {
    html += `<details style="margin:12px 0 4px"><summary style="cursor:pointer;list-style:none;font-family:'Space Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center"><span>Questions to Ask (${a.questions_to_ask.length})</span><span style="font-size:0.6rem">&#9660;</span></summary><div style="margin-top:10px">`;
    a.questions_to_ask.forEach(q => { html += `<div class="checklist-item"><input type="checkbox" class="checklist-cb"><span>${q}</span></div>`; });
    html += `</div></details>`;
  }
  if (a.features?.length) {
    html += `<div style="font-family:'Space Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);margin:12px 0 8px">Listed Features</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px">`;
    a.features.forEach(f => { html += `<span style="background:var(--surface2);padding:3px 10px;border-radius:12px;font-size:0.8rem">${f}</span>`; });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleCarfaxUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.name.toLowerCase().endsWith('.pdf') && file.type !== 'application/pdf') {
    alert('Please upload a PDF file.');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    alert('File is too large. Maximum 10MB.');
    return;
  }

  const uploadArea = document.getElementById('carfax-upload-area');
  const uploadText = document.getElementById('carfax-upload-text');
  const resultArea = document.getElementById('carfax-analysis-result');

  uploadArea.classList.add('loading');
  uploadText.textContent = `Analyzing ${file.name}\u2026`;
  resultArea.innerHTML = '';

  try {
    const base64 = await fileToBase64(file);

    const res = await fetch(`${API_BASE}/api/analyze-carfax`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Access-Pin': accessPin
      },
      body: JSON.stringify({ pdf: base64 })
    });

    if (res.status === 401) {
      resultArea.innerHTML = vinError('Incorrect PIN. Open DevTools \u2192 Application \u2192 Local Storage, delete <code>vehicle_tool_pin</code>, and reload to re-enter.');
      return;
    }
    if (res.status === 429) {
      resultArea.innerHTML = vinError('Daily limit reached (20 analyses/day per IP). Try again tomorrow.');
      return;
    }
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      resultArea.innerHTML = vinError(err.error || `Server error (${res.status})`);
      return;
    }

    const analysis = await res.json();
    carfaxAnalysisResult = analysis;
    checkBothDone();
    resultArea.innerHTML = renderCarfaxResults(analysis);

  } catch (err) {
    resultArea.innerHTML = vinError(`Failed: ${err.message}`);
  } finally {
    uploadArea.classList.remove('loading');
    uploadText.textContent = 'Click to upload a different Carfax PDF';
  }
}

function vinError(msg) {
  return `<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:8px;padding:14px;color:var(--red);font-size:0.85rem;margin-top:12px">${msg}</div>`;
}

function renderCarfaxResults(a) {
  const risk = a.risk_rating || 'YELLOW';

  let html = '<div style="margin-top:16px">';

  html += `<div style="text-align:center;margin-bottom:20px">
    <div class="risk-badge ${risk}">${risk}</div>
    <div style="color:var(--text-dim);font-size:0.9rem;margin-top:8px">${a.risk_summary || ''}</div>
  </div>`;

  html += '<div class="stat-pills">';
  html += `<div class="stat-pill">Title: ${a.title_status || '\u2014'}</div>`;
  html += `<div class="stat-pill">${a.owner_count ?? '?'} Owner${a.owner_count !== 1 ? 's' : ''}</div>`;
  html += `<div class="stat-pill">${a.accident_count ?? 0} Accident${a.accident_count !== 1 ? 's' : ''}</div>`;
  html += `<div class="stat-pill">Usage: ${a.usage_type || '\u2014'}</div>`;
  if (a.structural_damage) html += '<div class="stat-pill" style="background:var(--red-bg);color:var(--red)">\u26a0 Structural Damage</div>';
  if (a.airbag_deployed)   html += '<div class="stat-pill" style="background:var(--red-bg);color:var(--red)">\u26a0 Airbag Deployed</div>';
  if (a.flood_damage)      html += '<div class="stat-pill" style="background:var(--red-bg);color:var(--red)">\u26a0 Flood Damage</div>';
  html += '</div>';

  const reds = a.red_flags || [];
  const greens = a.green_flags || [];
  if (reds.length || greens.length) {
    html += '<div class="flags-grid">';
    reds.forEach(f => { html += `<div class="flag-item red">\u26a0 ${f}</div>`; });
    greens.forEach(f => { html += `<div class="flag-item green">\u2713 ${f}</div>`; });
    html += '</div>';
  }

  if (a.overall_assessment) {
    html += `<div style="background:var(--surface2);border-radius:8px;padding:14px;margin-bottom:16px;font-size:0.88rem;line-height:1.6">${a.overall_assessment}</div>`;
  }

  if (a.seller_questions?.length) {
    html += `<details style="margin-top:4px"><summary style="cursor:pointer;list-style:none;font-family:'Space Mono',monospace;font-size:0.72rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center"><span>Questions to Ask the Seller (${a.seller_questions.length})</span><span style="font-size:0.6rem">&#9660;</span></summary><div style="margin-top:10px">`;
    a.seller_questions.forEach(q => {
      html += `<div class="checklist-item"><input type="checkbox" class="checklist-cb"><span>${q}</span></div>`;
    });
    html += `</div></details>`;
  }

  html += '</div>';
  return html;
}

initPin();
setMode('compare');
</script>
