<div class="container">

    <button class="mode-tab" onclick="setMode(&#39;vin&#39;)">VIN Check</button>
  </div>
  
  <div id="compare-selectors" class="selectors" style="flex-direction:column;align-items:center;">

  </div>

  <div id="vin-panel">
    <div class="vin-input-row">
      <input id="vin-input" type="text" maxlength="17" placeholder="Enter 17-character VIN"
        autocomplete="off" spellcheck="false"
        oninput="this.value=this.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'')"
        onkeydown="if(event.key==='Enter')decodeVIN()" />
      <button class="vin-check-btn" onclick="decodeVIN()">Check VIN</button>
    </div>
    <div id="vin-results"></div>
  </div>
</div>

<div id="pin-overlay">
  <div class="pin-card">
    <h2>Vehicle Tool</h2>
    <p>Enter your access PIN to continue</p>
    <input id="pin-input" type="password" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')submitPin()" />
    <button id="pin-submit" onclick="submitPin()">Enter</button>
    <div id="pin-error"></div>
  </div>
</div>

let currentMode = 'compare';
const SLOT_LETTERS = ['A','B','C','D','E','F'];
let vehicleSlots = [];
let slotCounter = 0;

function addVehicleSlot() {
  if (vehicleSlots.length >= 6) return;
  const id = 'v' + (slotCounter++);
  vehicleSlots.push(id);
  
  const label = SLOT_LETTERS[vehicleSlots.length - 1] || id;
  const container = document.getElementById('vehicle-slots');
  
  const div = document.createElement('div');
  div.className = 'selector-group';
  div.id = `group-${id}`;
  div.innerHTML = `
    <div class="selector-label" id="label-${id}">Vehicle ${label}</div>
    ${vehicleSlots.length > 2 ? `<button class="remove-btn" onclick="removeVehicleSlot('${id}')" title="Remove">✕</button>` : ''}
    <div class="select-row">
      <select id="make-${id}" onchange="updateTrims('${id}'); compare();">
        <option value="">Make</option>
        <option value="rav4">Toyota RAV4</option>
        <option value="crv">Honda CR-V</option>
      </select>
      <select id="year-${id}" onchange="compare();">
        <option value="">Year</option>
      </select>
      <select id="trim-${id}" onchange="compare();">
        <option value="">Trim</option>
      </select>
    </div>
  `;
  container.appendChild(div);
  
  if (vehicleSlots.length >= 6) {
    document.getElementById('add-vehicle-btn').style.display = 'none';
  }
  updateSlotLabels();
}

function removeVehicleSlot(id) {
  const el = document.getElementById(`group-${id}`);
  if (el) el.remove();
  vehicleSlots = vehicleSlots.filter(s => s !== id);
  document.getElementById('add-vehicle-btn').style.display = '';
  updateSlotLabels();
  compare();
}

function updateSlotLabels() {
  vehicleSlots.forEach((id, i) => {
    const label = document.getElementById(`label-${id}`);
    if (label) label.textContent = `Vehicle ${SLOT_LETTERS[i] || (i+1)}`;
    // Show/hide remove buttons (keep minimum 2)
    const group = document.getElementById(`group-${id}`);
    if (group) {
      const removeBtn = group.querySelector('.remove-btn');
      if (vehicleSlots.length <= 2) {
        if (removeBtn) removeBtn.style.display = 'none';
      } else {
        if (removeBtn) removeBtn.style.display = '';
      }
    }
  });
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  const compareSelectors = document.getElementById('compare-selectors');
  const resultsDiv = document.getElementById('results');
  const vinPanel = document.getElementById('vin-panel');

  if (mode === 'vin') {
    compareSelectors.style.display = 'none';
    resultsDiv.style.display = 'none';
    vinPanel.style.display = 'block';
    return;
  }

  compareSelectors.style.display = '';
  resultsDiv.style.display = '';
  vinPanel.style.display = 'none';

  const slotsContainer = document.getElementById('vehicle-slots');
  const addBtn = document.getElementById('add-vehicle-btn');
  slotsContainer.innerHTML = '';
  vehicleSlots = [];
  slotCounter = 0;

  if (mode === 'single') {
    addBtn.style.display = 'none';
    const id = 'v' + (slotCounter++);
    vehicleSlots.push(id);
    const div = document.createElement('div');
    div.className = 'selector-group';
    div.id = `group-${id}`;
    div.innerHTML = `
      <div class="selector-label" id="label-${id}">Select Make & Trim</div>
      <div class="select-row">
        <select id="make-${id}" onchange="updateTrims('${id}'); compare();">
          <option value="">Make</option>
          <option value="rav4">Toyota RAV4</option>
          <option value="crv">Honda CR-V</option>
        </select>
        <select id="year-${id}" style="display:none;" onchange="compare();">
          <option value="">Year</option>
        </select>
        <select id="trim-${id}" onchange="compare();">
          <option value="">Trim</option>
        </select>
      </div>
    `;
    slotsContainer.appendChild(div);
  } else {
    addBtn.style.display = '';
    addVehicleSlot();
    addVehicleSlot();
  }

  document.getElementById('results').innerHTML = '<div class="empty-state"><div class="icon">🚗</div><div>' +
    (mode === 'single' ? 'Select a make and trim to see all years compared' : 'Select vehicles above to compare') +
    '</div></div>';
}

function updateTrims(id) {
  const make = document.getElementById(`make-${id}`).value;
  const yearSel = document.getElementById(`year-${id}`);
  const trimSel = document.getElementById(`trim-${id}`);
  
  yearSel.innerHTML = '<option value="">Year</option>';
  trimSel.innerHTML = '<option value="">Trim</option>';
  
  if (!make || !DB[make]) return;
  
  const group = document.getElementById(`group-${id}`);
  group.className = 'selector-group ' + (make === 'rav4' ? 'rav4-border' : 'crv-border');
  
  if (currentMode === 'single') {
    const allTrims = new Set();
    Object.values(DB[make].years).forEach(trims => trims.forEach(t => allTrims.add(t)));
    [...allTrims].sort().forEach(t => {
      trimSel.innerHTML += `<option value="${t}">${t}</option>`;
    });
    return;
  }
  
  Object.keys(DB[make].years).sort().forEach(y => {
    yearSel.innerHTML += `<option value="${y}">${y}</option>`;
  });
  
  yearSel.onchange = function() {
    trimSel.innerHTML = '<option value="">Trim</option>';
    const yr = parseInt(this.value);
    if (yr && DB[make].years[yr]) {
      DB[make].years[yr].forEach(t => {
        trimSel.innerHTML += `<option value="${t}">${t}</option>`;
      });
    }
    compare();
  };
}

function getVehicle(id) {
  const makeEl = document.getElementById(`make-${id}`);
  const yearEl = document.getElementById(`year-${id}`);
  const trimEl = document.getElementById(`trim-${id}`);
  if (!makeEl || !yearEl || !trimEl) return null;
  const make = makeEl.value;
  const year = yearEl.value;
  const trim = trimEl.value;
  if (!make || !year || !trim) return null;
  const key = `${year}-${trim}`;
  const data = DB[make].data[key];
  if (!data) return null;
  const name = make === 'rav4' ? 'Toyota RAV4' : 'Honda CR-V';
  return { make, year, trim, name: `${year} ${name} ${trim}`, data, color: make === 'rav4' ? 'rav4' : 'crv' };
}

function valClass(val) {
  if (!val) return 'val-neutral';
  const v = val.toString().toUpperCase();
  if (v === 'YES' || v.startsWith('YES')) return 'val-yes';
  if (v === 'NO' || v.startsWith('NO')) return 'val-no';
  return 'val-neutral';
}

function compare() {
  const results = document.getElementById('results');
  
  if (currentMode === 'single') {
    const id = vehicleSlots[0];
    const make = document.getElementById(`make-${id}`).value;
    const trim = document.getElementById(`trim-${id}`).value;
    if (!make || !trim) {
      results.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div>Select a make and trim to see all years compared</div></div>';
      return;
    }
    renderSingleAllYears(make, trim);
    return;
  }
  
  // Gather all valid vehicles from slots
  const vehicles = [];
  vehicleSlots.forEach(id => {
    const v = getVehicle(id);
    if (v) vehicles.push(v);
  });
  
  if (vehicles.length < 2) {
    results.innerHTML = '<div class="empty-state"><div class="icon">🚗</div><div>Select at least two vehicles to compare</div></div>';
    return;
  }
  
  renderCompareMulti(vehicles);
}

const YEAR_NOTES = {
  rav4: {
    2018: "2018: 4th generation (final year). 2.5L 176hp engine with 6-speed automatic. TSS-P safety suite standard (older version). NO Apple CarPlay or Android Auto. 6.1-inch touchscreen (7-inch on Limited+). Blind spot monitoring only standard on Limited+, optional package on XLE. Trims: LE, XLE, Adventure (new), SE, Limited, Platinum. Less power (176hp vs 203hp in 2019+), worse MPG (26 vs 30 combined), older platform.",
    2019: "2019: Complete 5th-gen redesign — new platform, new everything. Engine upgraded to 203hp. 8-speed auto replaces 6-speed. TSS 2.0 replaces TSS-P. Apple CarPlay added. No Android Auto. XLE: no power seat standard, heated seats AWD-only optional. Known TSB issues (battery drain, transmission jerkiness) — verify performed on any used purchase.",
    2020: "2020: Added Android Auto. XLE gets standard power driver's seat. Heated seats now available on FWD XLE (optional pkg). Hood sound insulation added on XLE. New TRD Off-Road trim added to lineup. TSB issues still present — verify performed.",
    2021: "2021: TSB battery drain and transmission issues resolved from factory — most reliable early model year. Otherwise identical to 2020. Roof rail leak issue still present on all trims with roof rails.",
    2022: "2022: Roof rail leak issue fixed (redesigned). XLE gets Bi-LED projector headlights (upgraded from reflector LED). Illuminated interior switches added on XLE+. Fog lights REMOVED from XLE. New wheel colors. Power passenger seat added on Limited.",
    2023: "2023: Major tech refresh — new 8-inch touchscreen (was 7-inch), wireless Apple CarPlay and Android Auto, new multimedia system with OTA updates, Toyota Safety Sense upgraded to TSS 2.5 (adds intersection turn assist, improved pedestrian detection). 7-inch digital instrument cluster. Roof rail leak fully resolved."
  },
  crv: {
    2018: "2018: 5th generation (2nd year). LX has older 2.4L engine (184hp, no turbo) and NO Honda Sensing safety suite — no auto braking, no adaptive cruise, no lane keep. EX and above get 1.5L turbo (190hp) and Honda Sensing. Apple CarPlay and Android Auto standard on EX+. Some oil dilution reports on 1.5T engine. No hybrid option. LX is very bare bones.",
    2019: "2019: No significant changes from 2018. LX still has 2.4L engine and NO Honda Sensing. EX-L with Navigation trim eliminated (nav now Touring-only, use CarPlay instead). Oil dilution issues mostly resolved. Still no hybrid option.",
    2020: "2020: Major update year — Honda Sensing standard ALL trims (was EX+ only). 1.5L turbo engine now standard ALL trims (LX had 2.4L before). Restyled front/rear exterior. Revised center console with better USB placement. First CR-V Hybrid introduced. LX still missing Apple CarPlay, touchscreen, blind spot monitoring.",
    2021: "2021: No significant changes from 2020 — essentially the same vehicle. Proven and reliable. LX still bare bones (no CarPlay, no touchscreen).",
    2022: "2022: Final year of 5th generation — no changes from 2021. Highly sought after for proven reliability. Touring trim now AWD only. LX still missing CarPlay and touchscreen. Best \"known quantity\" year to buy used.",
    2023: "2023: ALL-NEW 6th generation redesign. Bigger body (184.8\" vs 180.6\"). New interior design. LX FINALLY gets Apple CarPlay, Android Auto, and a 7-inch touchscreen. EX gets 9-inch screen. New safety features: hill descent control, snow mode, traffic sign recognition, low-speed braking. Sport Hybrid and Sport Touring Hybrid trims added. First-year new generation — potential early production quirks."
  }
};

function renderSingleAllYears(make, trim) {
  const makeName = make === 'rav4' ? 'Toyota RAV4' : 'Honda CR-V';
  const color = make === 'rav4' ? 'rav4' : 'crv';
  
  // Gather all years that have this trim
  const allYears = [];
  Object.keys(DB[make].years).sort().forEach(y => {
    const yr = parseInt(y);
    if (DB[make].years[yr].includes(trim)) {
      const key = `${yr}-${trim}`;
      if (DB[make].data[key]) {
        allYears.push({ year: yr, name: `${yr}`, data: DB[make].data[key] });
      }
    }
  });
  
  if (allYears.length === 0) {
    document.getElementById('results').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div>No data found for this combination</div></div>';
    return;
  }
  
  // Summary: count changes between consecutive years
  let changesHtml = '<div class="summary-bar">';
  for (let i = 1; i < allYears.length; i++) {
    let changes = 0;
    Object.keys(LABELS).forEach(key => {
      const a = (allYears[i-1].data[key]||'').toString().trim();
      const b = (allYears[i].data[key]||'').toString().trim();
      if (a !== b) changes++;
    });
    changesHtml += `<div class="summary-card"><div class="num ${changes > 0 ? 'yellow' : 'blue'}">${changes}</div><div class="label">${allYears[i-1].year}→${allYears[i].year}</div></div>`;
  }
  changesHtml += '</div>';
  
  let html = `<div style="text-align:center;margin-bottom:16px;font-family:'Space Mono',monospace;font-size:1.1rem;color:var(--${color})">${makeName} ${trim} — All Years</div>`;
  html += changesHtml;
  
  for (const [cat, keys] of Object.entries(CATEGORIES)) {
    // Check for any diffs across all years in this category
    let catHasDiff = false;
    keys.forEach(key => {
      const first = (allYears[0].data[key]||'').toString().trim();
      allYears.forEach(av => {
        if ((av.data[key]||'').toString().trim() !== first) catHasDiff = true;
      });
    });
    const badge = catHasDiff ? '<span class="same-badge badge-diff">has changes</span>' : '<span class="same-badge badge-same">no changes across years</span>';
    
    html += `<div class="category"><div class="category-header">${cat} ${badge}</div>`;
    html += '<table class="feature-table"><thead><tr><th>Feature</th>';
    allYears.forEach(av => {
      html += `<th class="${color}-th">${av.name}</th>`;
    });
    html += '<th class="edge-th">Changed?</th>';
    html += '</tr></thead><tbody>';
    
    for (const key of keys) {
      const vals = allYears.map(av => av.data[key] || 'N/A');
      const isDiff = vals.some(val => val.toString().trim() !== vals[0].toString().trim());
      const rowStyle = isDiff ? 'style="background:rgba(251,191,36,0.04)"' : '';
      
      html += `<tr ${rowStyle}><td>${LABELS[key]||key}</td>`;
      vals.forEach((val, i) => {
        let cls = valClass(val);
        if (i > 0 && val.toString().trim() !== vals[i-1].toString().trim()) {
          html += `<td class="${cls}" style="background:rgba(52,211,153,0.1);font-weight:600">${val}</td>`;
        } else {
          html += `<td class="${cls}">${val}</td>`;
        }
      });
      html += `<td class="${isDiff ? 'val-win' : 'val-tie'}">${isDiff ? '⚡ Changed' : '—'}</td>`;
      html += '</tr>';
    }
    html += '</tbody></table></div>';
  }
  
  // Year-over-year notes
  html += '<div class="category" style="margin-top:24px">';
  html += '<div class="category-header" style="cursor:pointer" onclick="document.getElementById(\'yoy-notes\').style.display=document.getElementById(\'yoy-notes\').style.display===\'none\'?\'block\':\'none\'">📋 Key Year-Over-Year Changes (click to expand/collapse)</div>';
  html += '<div id="yoy-notes" style="background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:16px">';
  
  const makeNotes = YEAR_NOTES[make];
  const noteYears = Object.keys(makeNotes).map(Number).sort();
  noteYears.forEach(ny => {
    const note = makeNotes[ny];
    const hasThisYear = allYears.some(av => av.year === ny);
    const style = hasThisYear ? 'border-left:3px solid var(--accent);padding-left:12px;margin-bottom:14px' : 'border-left:3px solid var(--border);padding-left:12px;margin-bottom:14px';
    const titleStyle = hasThisYear ? 'color:var(--accent);font-weight:700' : 'color:var(--text-dim);font-weight:600';
    html += `<div style="${style}"><div style="${titleStyle};font-family:'Space Mono',monospace;font-size:0.8rem;margin-bottom:4px">${ny} ${makeName}</div>`;
    html += `<div style="font-size:0.83rem;color:var(--text);line-height:1.5">${note}</div></div>`;
  });
  
  html += '</div></div>';
  
  document.getElementById('results').innerHTML = html;
}

function renderCompareMulti(vehicles) {
  const allKeys = Object.keys(LABELS);
  
  // Count all-same vs different
  let same = 0, diff = 0;
  allKeys.forEach(key => {
    const first = (vehicles[0].data[key]||'').toString().trim();
    const allSame = vehicles.every(v => (v.data[key]||'').toString().trim() === first);
    if (allSame) same++; else diff++;
  });
  
  let html = `<div class="summary-bar">
    <div class="summary-card"><div class="num blue">${same}</div><div class="label">Same</div></div>
    <div class="summary-card"><div class="num yellow">${diff}</div><div class="label">Different</div></div>
    <div class="summary-card"><div class="num green">${vehicles.length}</div><div class="label">Vehicles</div></div>
  </div>`;
  
  html += `<div class="results-header"><div class="results-title">Feature Comparison</div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot yes"></div>Has feature</div>
      <div class="legend-item"><div class="legend-dot no"></div>Missing</div>
      <div class="legend-item"><div class="legend-dot win"></div>Difference</div>
    </div></div>`;
  
  for (const [cat, keys] of Object.entries(CATEGORIES)) {
    const catDiffs = keys.filter(k => {
      const first = (vehicles[0].data[k]||'').toString().trim();
      return !vehicles.every(v => (v.data[k]||'').toString().trim() === first);
    });
    const badge = catDiffs.length > 0 ? `<span class="same-badge badge-diff">${catDiffs.length} diff</span>` : `<span class="same-badge badge-same">all same</span>`;
    
    html += `<div class="category"><div class="category-header">${cat} ${badge}</div>`;
    html += `<table class="feature-table"><thead><tr><th>Feature</th>`;
    vehicles.forEach(v => {
      html += `<th class="${v.color}-th">${v.name}</th>`;
    });
    html += `<th class="edge-th">Edge</th></tr></thead><tbody>`;
    
    for (const key of keys) {
      const vals = vehicles.map(v => v.data[key] || 'N/A');
      const first = vals[0].toString().trim();
      const isDiff = !vals.every(v => v.toString().trim() === first);
      
      let edge = '';
      let edgeClass = 'val-tie';
      if (isDiff) {
        // Check if any vehicle has Yes while others have No
        const yesVehicles = [];
        const noVehicles = [];
        vehicles.forEach((v, i) => {
          const up = vals[i].toString().toUpperCase();
          if (up.startsWith('YES')) yesVehicles.push(v);
          else if (up.startsWith('NO')) noVehicles.push(v);
        });
        if (yesVehicles.length > 0 && noVehicles.length > 0 && yesVehicles.length < vehicles.length) {
          const winners = yesVehicles.map(v => v.name.split(' ').slice(1,3).join(' '));
          edge = `★ ${[...new Set(winners)].join(', ')}`;
          edgeClass = 'val-win';
        } else {
          edge = '↔ Different';
          edgeClass = 'val-win';
        }
      } else {
        edge = 'Tie';
      }
      
      const rowStyle = isDiff ? 'style="background:rgba(251,191,36,0.04)"' : '';
      html += `<tr ${rowStyle}><td>${LABELS[key]||key}</td>`;
      vals.forEach(val => {
        html += `<td class="${valClass(val)}">${val}</td>`;
      });
      html += `<td class="${edgeClass}">${edge}</td></tr>`;
    }
    html += '</tbody></table></div>';
  }
  
  // Notes
  html += '<div class="category" style="margin-top:24px">';
  html += '<div class="category-header" style="cursor:pointer" onclick="document.getElementById(\'yoy-notes-compare\').style.display=document.getElementById(\'yoy-notes-compare\').style.display===\'none\'?\'block\':\'none\'">📋 Key Year-Over-Year Changes (click to expand/collapse)</div>';
  html += '<div id="yoy-notes-compare" style="background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:16px">';
  
  const makes = new Set(vehicles.map(v => v.make));
  makes.forEach(make => {
    const makeName = make === 'rav4' ? 'Toyota RAV4' : 'Honda CR-V';
    const makeNotes = YEAR_NOTES[make];
    const noteYears = Object.keys(makeNotes).map(Number).sort();
    html += `<div style="margin-top:8px"><div style="font-family:'Space Mono',monospace;font-size:0.8rem;color:${make==='rav4'?'var(--rav4)':'var(--crv)'};margin-bottom:10px;text-transform:uppercase;letter-spacing:1px">${makeName} Changes</div>`;
    noteYears.forEach(ny => {
      const note = makeNotes[ny];
      const matchingVehicles = vehicles.filter(v => v.make === make && parseInt(v.year) === ny);
      const highlight = matchingVehicles.length > 0;
      const style = highlight ? 'border-left:3px solid var(--accent);padding-left:12px;margin-bottom:12px' : 'border-left:3px solid var(--border);padding-left:12px;margin-bottom:12px';
      const titleStyle = highlight ? 'color:var(--accent);font-weight:700' : 'color:var(--text-dim);font-weight:600';
      const tags = matchingVehicles.map(v => {
        const idx = vehicles.indexOf(v);
        return SLOT_LETTERS[idx] || '';
      }).join(', ');
      const tag = highlight ? ` ◄ Vehicle ${tags}` : '';
      html += `<div style="${style}"><div style="${titleStyle};font-family:'Space Mono',monospace;font-size:0.8rem;margin-bottom:4px">${ny}${tag}</div>`;
      html += `<div style="font-size:0.83rem;color:var(--text);line-height:1.5">${note}</div></div>`;
    });
    html += '</div>';
  });
  
  html += '</div></div>';
  
  document.getElementById('results').innerHTML = html;
}
// Init — start with 2 compare slots
setMode('compare');
</script>
